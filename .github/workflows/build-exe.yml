name: exe を作る（ARE QUEST）

# 自動：毎週 金曜 20:00（日本時間）。手動（Actions タブ →「exe を作る」→ Run workflow）や、exe-v1.0.0 のようなタグでも動きます。
# ※ cron は UTC で書くため、日本時間の 20:00 ＝ UTC の 11:00。GitHub の混み具合で数分〜数十分おくれることがあります。
# ※ このリポジトリに 60 日間 何も変更がないと、GitHub が自動実行を止めます（Actions タブで「Enable workflow」を押すと再開）。
on:
  schedule:
    - cron: "0 11 * * 5"
  workflow_dispatch:
  push:
    tags: ["exe-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 部品を入れる
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: exe を作る
        working-directory: desktop
        run: npm run dist
      - name: 作った exe を保存する（Actions の Artifacts からダウンロードできます）
        uses: actions/upload-artifact@v4
        with:
          name: ARE-QUEST-exe
          path: desktop/dist/ARE-QUEST.exe
          if-no-files-found: error
      - name: タグのときは Releases にも置く（自動実行では置かない）
        if: startsWith(github.ref, 'refs/tags/exe-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" desktop/dist/ARE-QUEST.exe --title "ARE QUEST ${{ github.ref_name }}（Windows 用 exe）" --notes "ダウンロードして ARE-QUEST.exe をダブルクリックすると遊べます。インストールは不要です。"
