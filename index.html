<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="./protect.js"></script><script src="./shared/are-padmap.js"></script><script src="./shared/are-pad.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1030">
<title>ARE ゲーム ｜ あそびたいゲームをえらぼう</title>
<meta name="description" content="AREのゲームをジャンル別にまとめた入口です。RPG・推理・パズル・アクション・カード・ミニゲームなど、ブラウザですぐあそべます（無料）。">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./shared/games-hub.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow">
      <a class="back" id="backTop" href="https://arechat.github.io/ARE/login.html">← チャットへもどる</a>
      <div id="langsw"></div>
    </div>
    <span class="logo">ARE GAMES</span>
    <h1 id="h1">あそびたいゲームを<br>えらぼう</h1>
    <p class="lead" id="lead">ぜんぶブラウザでそのままあそべます（無料）。スマホ・タブレットは<b>横向き</b>がおすすめです。</p>
    <div class="resume" id="resume"></div>
    <div class="recrow"><button type="button" class="recbtn" id="recBtn" aria-haspopup="dialog">📊 あなたの記録</button></div>
  </header>

  <h2 class="sect" id="tilesH">ジャンルから えらぶ</h2>
  <nav class="tiles" id="tiles" aria-labelledby="tilesH"></nav>

  <nav class="chips" id="chips" aria-label="ゲームのしぼりこみ"></nav>

  <main>
    <div class="grid" id="grid"><noscript><p>このページは JavaScript を使います。ブラウザの設定で JavaScript をオンにしてください。</p></noscript></div>
    <p class="empty" id="empty">このしぼりこみに合うゲームはありません。</p>
  </main>

  <div class="foot">
    <a id="backBottom" href="https://arechat.github.io/ARE/login.html">💬 チャットへもどる</a>
    <a href="https://arechat.github.io/LearnLab124/" id="learn">📚 学習サイト（LearnLab124）</a>
    <a href="./help.html" id="helpLink">❓ あそびかた・よくある質問</a>
  </div>
  <p class="note" id="note">セーブはこの端末のブラウザに保存されます（別の端末・別のブラウザには引きつがれません）。</p>
</div>

<script src="./shared/games-data.js"></script>
<script src="./shared/games-registry.js"></script>
<script src="./shared/hub-record.js"></script>
<script>
(function(){
  "use strict";
  var G = window.AREGames;
  if(!G){ return; }
  var $ = function(id){ return document.getElementById(id); };
  var tgt = G.chatTarget(), back = tgt.back, chat = tgt.chat;
  var filter = "all";
  var NEWKEY = "new";

  function backQ(){ return back ? "&back=" + encodeURIComponent(back) : ""; }
  function render(){
    var l = G.lang(), last = G.lastGameId();
    document.documentElement.lang = l;
    document.title = G.ui("title");
    var md = document.querySelector('meta[name="description"]'); if(md) md.setAttribute("content", G.ui("metaDesc"));
    $("langsw").innerHTML = G.langSwitchHTML(l);
    $("backTop").textContent = G.ui("backChat"); $("backBottom").textContent = G.ui("backChat2");
    $("backTop").href = chat; $("backBottom").href = chat;
    $("h1").innerHTML = G.ui("h1"); $("lead").innerHTML = G.ui("lead");
    $("learn").textContent = G.ui("learn"); $("helpLink").textContent = G.ui("help"); $("note").textContent = G.ui("note");
    $("tilesH").textContent = G.ui("genreTiles");
    $("recBtn").textContent = G.ui("myStats"); $("recBtn").hidden = !window.AREHubRecord;
    $("chips").setAttribute("aria-label", G.ui("chipsLabel"));
    $("empty").textContent = G.ui("empty");

    // ジャンルのタイル（ジャンルページへ）
    $("tiles").innerHTML = G.genres.map(function(gn){
      var n = G.ofGenre(gn.id).length;
      return '<a class="tile" href="genre/index.html?g=' + encodeURIComponent(gn.id) + backQ() + '" style="--c1:' + gn.c1 + ';--c2:' + gn.c2 + '" data-genre="' + G.esc(gn.id) + '">' +
        '<img src="thumbs/genre-' + G.esc(gn.id) + '.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()">' +
        '<span class="te" aria-hidden="true">' + gn.emoji + '</span><b>' + G.esc(G.t(gn.name)) + '</b><small>' + G.esc(G.count(n)) + '</small></a>';
    }).join("");

    // しぼりこみのチップ
    var chips = [["all", G.ui("all")], [NEWKEY, G.ui("newest")]].concat(G.genres.map(function(gn){ return [gn.id, gn.emoji + " " + G.t(gn.name)]; }));
    $("chips").innerHTML = chips.map(function(c){ return '<button type="button" class="chip" data-f="' + G.esc(c[0]) + '" aria-pressed="' + (c[0] === filter ? "true" : "false") + '">' + G.esc(c[1]) + '</button>'; }).join("");

    // ジャンルごとにまとめて ならべる（しんさくは 上に。ゲーム自体は もとのジャンルにも のる）
    var groups = [{id: NEWKEY, label: G.ui("newest"), list: G.games.filter(function(g){ return g.isNew; })}].concat(G.genres.map(function(gn){
      return {id: gn.id, label: gn.emoji + " " + G.t(gn.name), list: G.ofGenre(gn.id), link: true};
    }));
    $("grid").innerHTML = groups.map(function(gp){
      if(!gp.list.length) return "";
      return '<section class="grp" data-grp="' + G.esc(gp.id) + '"><h2 class="gh">' + G.esc(gp.label) + ' <small>' + gp.list.length + '</small>' +
        (gp.link ? ' <a class="gl" href="genre/index.html?g=' + encodeURIComponent(gp.id) + backQ() + '">' + G.esc(G.ui("genrePage")) + '</a>' : '') +
        '</h2><div class="cg">' + gp.list.map(function(g){ return G.cardHTML(g, {lang: l, last: last, back: back, dup: gp.id !== NEWKEY && g.isNew}); }).join("") + '</div></section>';
    }).join("");

    var lg = G.byId(last);
    if(lg){
      $("resume").innerHTML = '<a href="' + G.esc(G.gameUrl(lg, back)) + '" data-id="' + G.esc(lg.id) + '"><span class="ico" aria-hidden="true">' + lg.emoji + '</span><span><small>' + G.esc(G.ui("lastBig")) + '</small><b>' + G.esc(G.t(lg.name)) + (G.t(lg.sub) ? ' ' + G.esc(G.t(lg.sub)) : '') + '</b></span><span class="go">' + G.esc(G.ui("cont")) + '</span></a>';
      $("resume").className = "resume on";
    }else{ $("resume").innerHTML = ""; $("resume").className = "resume"; }
    applyFilter(filter);
  }

  function applyFilter(f){
    filter = f; var shown = 0;
    [].forEach.call($("grid").querySelectorAll(".grp"), function(sec){
      var ok = f === "all" ? true : sec.dataset.grp === f, cnt = 0;
      [].forEach.call(sec.querySelectorAll(".card"), function(c){ var vis = ok && !(f === "all" && c.classList.contains("dupnew")); c.style.display = vis ? "" : "none"; if(vis) cnt++; });
      sec.style.display = (ok && cnt) ? "" : "none"; shown += cnt;
    });
    $("empty").style.display = shown ? "none" : "block";
  }

  $("grid").addEventListener("click", function(e){
    var a = e.target.closest ? e.target.closest(".card") : null;
    if(a) G.recordPlay(a.dataset.id);
  });
  $("resume").addEventListener("click", function(e){
    var a = e.target.closest ? e.target.closest("a[data-id]") : null;
    if(a) G.recordPlay(a.dataset.id);
  });
  $("recBtn").addEventListener("click", function(){ if(window.AREHubRecord) window.AREHubRecord.open({prefix: "", back: back}); });
  $("chips").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".chip") : null;
    if(!b) return;
    [].forEach.call(document.querySelectorAll(".chip"), function(c){ c.setAttribute("aria-pressed", c === b ? "true" : "false"); });
    applyFilter(b.dataset.f);
  });
  $("langsw").addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest(".lb") : null;
    if(!b) return;
    G.setLang(b.dataset.lang); render();
    var nb = document.querySelector('.lb[aria-pressed="true"]'); if(nb) nb.focus();
  });
  window.addEventListener("storage", function(e){ if(e.key === "are_lang") render(); });
  render();
})();
</script>
<script>/* ゲーム入口もオフラインで開けるように、サービスワーカーを登録 */(function(){try{if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js",{scope:"./"}).catch(function(){});});}}catch(_e){}})();</script>
<script src="./shared/first-tips.js" defer></script>
</body>
</html>
