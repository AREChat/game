<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>こだまの部屋｜自分の動きが「こだま」になるパズル</title>
<meta name="theme-color" content="#0d0a2a">
<meta name="description" content="自分の動きが「こだま」になって、いっしょに動く頭脳パズル。スイッチを押してとびらを開けよう。日本語・英語・中国語・韓国語に対応。">
<script src="../protect.js"></script><script src="../shared/are-sync.js?v=1"></script><script src="../shared/are-padmap.js"></script>
<link rel="stylesheet" href="./css/lab.css">
<style>
#s-play{padding:0;gap:0;justify-content:flex-start;overflow:hidden}
#bar{width:100%;padding:calc(8px + env(safe-area-inset-top)) 100px 4px 100px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px;min-height:44px}
#bar #nm{font-weight:900;font-size:15px;text-align:left;flex:1 1 90px;min-width:0}
#bar .pill{background:#14164acc;border:1px solid #5a63d8;border-radius:999px;padding:3px 11px;font-weight:800;font-size:13px;white-space:nowrap}
#bar .pill.good{background:#17695a;border-color:#59e6d0}
#stageWrap{position:relative;flex:1;width:100%;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#14164af2;border:1px solid #8a8fff;border-radius:12px;padding:6px 14px;font-size:14px;font-weight:700;display:none;max-width:92%;text-align:center;z-index:5}
#msg.on{display:block}
#msg{width:max-content;pointer-events:none}
#ctrl{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(#0f1040e6,#0a0a2cf5);border-top:1px solid #3a3f9a}
#dpad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:5px}
#dpad button{padding:0;font-size:24px;font-weight:900;border-radius:14px}
#dpad .u{grid-column:2;grid-row:1}#dpad .l{grid-column:1;grid-row:2}#dpad .d{grid-column:2;grid-row:2}#dpad .r{grid-column:3;grid-row:2}
#side{display:grid;grid-template-columns:repeat(2,auto);gap:6px}
#side button{padding:7px 10px;font-size:13px;min-width:92px}
#side #bEcho{grid-column:1 / span 2;font-weight:900}
#side #bEcho:disabled{opacity:.35}
#levels{width:min(96vw,640px);display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;overflow-y:auto;max-height:calc(100% - 150px);padding:2px}
.lv{position:relative;padding:8px 0 15px;font-weight:900;font-size:16px;border-radius:12px}
.lv small{position:absolute;left:0;right:0;bottom:1px;font-size:9px;letter-spacing:1px;color:#ffd35a}
.lv.lock{opacity:.35;pointer-events:none}
#lgBtn{position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:40;padding:5px 11px;font-size:12px;border-radius:999px}
#s-play #lgBtn{display:none}
@media (max-width:380px),(max-height:620px){
#dpad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,42px);gap:4px}
#dpad button{font-size:20px}
#side{gap:4px}#side button{min-width:0;padding:5px 6px;font-size:11px;min-height:38px}
#ctrl{gap:6px;padding:4px 6px calc(6px + env(safe-area-inset-bottom))}
#bar{padding-left:96px;padding-right:96px}
}
@media (orientation:landscape) and (max-height:520px){
#s-play.on{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr);align-items:stretch;justify-content:stretch}
#bar{grid-column:1 / span 2}
#stageWrap{grid-column:1;grid-row:2}
#ctrl{grid-column:2;grid-row:2;flex-direction:column;width:min(44vw,240px);border-top:0;border-left:1px solid #3a3f9a;padding:6px 10px calc(6px + env(safe-area-inset-bottom));justify-content:center}
}
</style>
<script src="../shared/are-offline.js" defer></script>
</head>
<body>
<button id="exitBtn" type="button" aria-label="back">← もどる</button>
<button id="sndBtn" type="button" aria-label="sound">🔊</button>
<button id="padBtn" type="button" aria-label="controls" data-gki-settings>🎮</button>
<main id="app">
  <section id="s-title" class="scr on">
    <div class="logo">こだまの<br>部屋</div>
    <p class="sub" id="tSub"></p>
    <div class="menu">
      <button id="bStages" type="button" class="big"></button>
      <button id="bHow" type="button"></button>
    </div>
    <p class="hint" id="tNote"></p>
  </section>

  <section id="s-how" class="scr">
    <h2 id="hT"></h2>
    <div class="panel" id="hBody"></div>
    <div class="row"><button id="bHowBack" type="button"></button></div>
  </section>

  <section id="s-sel" class="scr">
    <h2 id="selT"></h2>
    <div id="levels"></div>
    <div class="row"><button id="bSelBack" type="button"></button></div>
  </section>

  <section id="s-play" class="scr">
    <div id="bar"><div id="nm"></div><span class="pill" id="rd"></span><span class="pill" id="mv"></span></div>
    <div id="stageWrap"><canvas id="cv"></canvas><div id="msg"></div></div>
    <div id="ctrl">
      <div id="dpad"><button class="u" data-c="U" type="button" aria-label="up">▲</button><button class="l" data-c="L" type="button" aria-label="left">◀</button><button class="d" data-c="D" type="button" aria-label="down">▼</button><button class="r" data-c="R" type="button" aria-label="right">▶</button></div>
      <div id="side"><button id="bEcho" type="button" class="teal"></button><button id="bWait" type="button"></button><button id="bUndo" type="button"></button><button id="bRound" type="button"></button><button id="bReset" type="button"></button></div>
    </div>
  </section>
</main>
<button id="lgBtn" type="button">日本語</button>
<div id="toast" class="toast"></div>
<div class="modal" id="mClear"><div class="box"><h2 id="clT"></h2><div class="stars" id="clStars"></div><p class="sub" id="clB"></p>
  <div class="row" style="margin-top:10px"><button id="clNext" type="button" class="big"></button><button id="clRetry" type="button"></button><button id="clSel" type="button"></button></div></div></div>
<script src="../shared/are-pad.js"></script>
<script src="../shared/gk-input.js"></script>
<script src="../shared/gk.js"></script>
<script src="./js/ec-core.js"></script>
<script src="./js/ec-levels.js"></script>
<script src="./js/ec-ui.js"></script>
<script src="../shared/first-tips.js" defer></script>
</body>
</html>
