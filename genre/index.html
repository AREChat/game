<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="../protect.js"></script><script src="../shared/are-padmap.js"></script><script src="../shared/are-pad.js" defer></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1030">
<title>ARE ゲーム ｜ ジャンル</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="stylesheet" href="../shared/games-hub.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow">
      <a class="back" id="hubTop" href="../index.html">← ゲーム一覧へ</a>
      <div id="langsw"></div>
    </div>
    <span class="logo">ARE GAMES</span>
    <div class="gp-head" id="gphead"></div>
  </header>
  <main id="main"></main>
  <div class="foot">
    <a id="hubBottom" href="../index.html">🏠 ゲーム一覧</a>
    <a id="backBottom" href="https://arechat.github.io/ARE/login.html">💬 チャットへもどる</a>
  </div>
  <p class="note" id="note"></p>
</div>
<script src="../shared/games-data.js"></script>
<script src="../shared/games-registry.js"></script>
<script>
(function(){
  "use strict";
  var G = window.AREGames, $ = function(id){ return document.getElementById(id); };
  if(!G) return;
  var tgt = G.chatTarget(), back = tgt.back, chat = tgt.chat, gid = "";
  try{ gid = new URLSearchParams(location.search).get("g") || ""; }catch(_e){}
  var gn = G.genre(gid);
  function bq(){ return back ? "?back=" + encodeURIComponent(back) : ""; }
  function fmtDate(ms, l){
    try{ return new Date(ms).toLocaleDateString(l === "zh" ? "zh-CN" : l === "ko" ? "ko-KR" : l === "en" ? "en-US" : "ja-JP", {year: "numeric", month: "short", day: "numeric"}); }catch(_e){ return G.dayKey(ms); }
  }
  function render(){
    var l = G.lang(), last = G.lastGameId();
    document.documentElement.lang = l;
    $("langsw").innerHTML = G.langSwitchHTML(l);
    $("hubTop").textContent = G.ui("hub"); $("hubTop").href = "../index.html" + bq();
    $("hubBottom").textContent = G.ui("navAll"); $("hubBottom").href = "../index.html" + bq();
    $("backBottom").textContent = G.ui("backChat2"); $("backBottom").href = chat;
    $("note").textContent = G.ui("note");
    if(!gn){
      document.title = "ARE GAMES";
      $("gphead").innerHTML = "";
      $("main").innerHTML = '<p class="nf" id="nf">' + G.esc(G.ui("notFound")) + '</p>';
      setTimeout(function(){ try{ location.replace("../index.html" + bq()); }catch(_e){} }, 1800);
      return;
    }
    var name = G.t(gn.name), list = G.ofGenre(gn.id), st = G.genreStats(gn.id);
    document.title = name + " ｜ ARE GAMES";
    $("gphead").innerHTML = '<span class="ge" aria-hidden="true">' + gn.emoji + '</span><div><h1>' + G.esc(name) + '</h1><p class="gp-blurb">' + G.esc(G.t(gn.blurb)) + '</p></div>';
    var tips = G.t(gn.tips) || [];
    var rec;
    if(!st.total){ rec = '<p class="none">' + G.esc(G.ui("recNone")) + '</p>'; }
    else{
      rec = '<div>' + G.esc(G.ui("recTotal", {n: st.total})) + '　' + G.esc(G.ui("recLastAt", {d: fmtDate(st.last, l)})) + '</div><ul>' +
        st.rows.filter(function(r){ return r.n > 0; }).map(function(r){ return '<li><span>' + G.esc(G.t(G.byId(r.id).name)) + '</span><b>' + G.esc(G.ui("recTimes", {n: r.n})) + '</b></li>'; }).join("") + '</ul>' +
        '<button type="button" class="btn2" id="recClear">' + G.esc(G.ui("recClear")) + '</button>';
    }
    var others = G.genres.filter(function(x){ return x.id !== gn.id; }).map(function(x){
      return '<a class="tile" href="index.html?g=' + encodeURIComponent(x.id) + (back ? "&back=" + encodeURIComponent(back) : "") + '" style="--c1:' + x.c1 + ';--c2:' + x.c2 + '"><img src="../thumbs/genre-' + G.esc(x.id) + '.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"><span class="te" aria-hidden="true">' + x.emoji + '</span><b>' + G.esc(G.t(x.name)) + '</b><small>' + G.esc(G.count(G.ofGenre(x.id).length)) + '</small></a>';
    }).join("");
    $("main").innerHTML =
      '<h2 class="sect">' + G.esc(G.ui("howGenre")) + '</h2><ul class="tips">' + tips.map(function(x){ return '<li>' + G.esc(x) + '</li>'; }).join("") + '</ul>' +
      '<h2 class="sect">' + G.esc(G.ui("myRec")) + '</h2><div class="rec" id="rec">' + rec + '</div>' +
      '<h2 class="sect">' + G.esc(G.ui("order")) + '</h2><div class="cg" id="cg">' + list.map(function(g, i){
        return G.cardHTML(g, {lang: l, last: last, back: back, prefix: "../"}).replace('</div><div class="body">', '<span class="ord" aria-hidden="true">' + (i + 1) + '</span></div><div class="body">');
      }).join("") + '</div>' +
      '<h2 class="sect">' + G.esc(G.ui("otherGenres")) + '</h2><nav class="tiles" id="tiles">' + others + '</nav>';
  }
  document.addEventListener("click", function(e){
    var a = e.target.closest ? e.target.closest(".card") : null;
    if(a){ G.recordPlay(a.dataset.id); return; }
    var c = e.target.closest ? e.target.closest("#recClear") : null;
    if(c){ var ok = true; try{ ok = window.confirm(G.ui("recClearAsk")); }catch(_e){} if(ok){ G.clearLog(); render(); } return; }
    var b = e.target.closest ? e.target.closest(".lb") : null;
    if(b){ G.setLang(b.dataset.lang); render(); var nb = document.querySelector('.lb[aria-pressed="true"]'); if(nb) nb.focus(); }
  });
  window.addEventListener("storage", function(e){ if(e.key === "are_lang" || e.key === "are_play_log") render(); });
  render();
})();
</script>
<script>/* オフラインでも開けるように、サービスワーカーを登録（ゲーム入口と同じ） */(function(){try{if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){window.addEventListener("load",function(){navigator.serviceWorker.register("../sw.js",{scope:"../"}).catch(function(){});});}}catch(_e){}})();</script>
</body>
</html>
